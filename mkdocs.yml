site_name: Narrative Forge
site_description: Data-driven dialogue, quests and localisation for Unity.
site_url: https://camenduru.github.io/NarrativeForgeDoc/
repo_url: https://github.com/camenduru/NarrativeForgeDoc
repo_name: camenduru/NarrativeForgeDoc
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Camenduru

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  language: en
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
      - Scene setup: getting-started/scene-setup.md
  - Dialogue:
      - Overview: dialogue/overview.md
      - JSON reference: dialogue/json-reference.md
      - Conditions: dialogue/conditions.md
      - Examples: dialogue/examples.md
  - Quests:
      - Overview: quests/overview.md
      - JSON reference: quests/json-reference.md
      - Gameplay events: quests/gameplay-events.md
  - Localisation: localisation.md
  - Save and load: save-load.md
  - Unity components: unity-components.md
  - API reference: api-reference.md
  - Validation: validation.md
  - Demo: demo.md
  - Troubleshooting: troubleshooting.md
  - Support: support.md
  - Changelog: changelog.md
  - License: license.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/camenduru
    - icon: material/email
      link: mailto:unity@camenduru.com
